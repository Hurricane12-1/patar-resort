version: '3.8'

services:
  # Multi-Worker Node Application Cluster
  app_cluster:
    image: node:20-alpine
    container_name: jd_app_cluster_v1_1
    working_dir: /app
    environment:
      - NODE_ENV=production
      - PORT=4000
      - CLUSTER_WORKERS=2
      - REDIS_URL=redis://redis_cache:6379
      - REDIS_ENABLED=true
    volumes:
      - .:/app
    command: node scripts/load_balancer.js
    depends_on:
      - redis_cache
    restart: unless-stopped
    expose:
      - "4000"

  # Redis In-Memory High-Performance Caching Layer
  redis_cache:
    image: redis:7-alpine
    container_name: jd_redis_cache_v1_1
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # High-Availability Nginx Reverse Proxy & Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: jd_nginx_lb_v1_1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./server/certs:/etc/ssl/certs:ro
      - ./client/dist:/var/www/jd-beach-house/client/dist:ro
    depends_on:
      - app_cluster
    restart: unless-stopped

volumes:
  redis_data:
