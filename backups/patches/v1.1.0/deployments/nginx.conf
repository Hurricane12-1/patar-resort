# ==============================================================================
# J & D Beach House High-Availability Nginx Reverse Proxy & Load Balancer
# Version: 1.1 Enterprise (Round-Robin, TLS Termination, WebSocket Upgrades)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging format with request timing and upstream response time
    log_format upstream_log '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'upstream: $upstream_addr '
                           'upstream_response_time: $upstream_response_time '
                           'request_time: $request_time';

    access_log /var/log/nginx/access.log upstream_log;
    error_log  /var/log/nginx/error.log warn;

    # Upstream Backend Cluster (Round-Robin Load Balancing)
    upstream jd_backend_cluster {
        least_conn; # Distribute to worker with fewest active connections
        server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP to HTTPS Global Redirection
    server {
        listen 80;
        server_name localhost janddbeachhouse.local;
        return 301 https://$host$request_uri;
    }

    # HTTPS Load Balanced Entrypoint
    server {
        listen 443 ssl http2;
        server_name localhost janddbeachhouse.local;

        # TLS / SSL Certificates
        ssl_certificate     /etc/ssl/certs/cert.pem;
        ssl_certificate_key /etc/ssl/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # API & GraphQL Reverse Proxy to Upstream Cluster
        location /api/ {
            proxy_pass http://jd_backend_cluster;
            proxy_http_version 1.1;

            # Header preservation
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # WebSocket Duplex Stream Proxy (Socket.io AI Chatbot)
        location /socket.io/ {
            proxy_pass http://jd_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s; # 24h WebSocket keepalive
        }

        # Client Static Single Page Application (SPA)
        location / {
            root /var/www/jd-beach-house/client/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
