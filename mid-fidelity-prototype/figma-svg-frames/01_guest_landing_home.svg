<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="1520" viewBox="0 0 1440 1520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>01 - Guest Landing Page (TEV, CAT, GEL, CATH)</title>
  <defs>
    <style>
